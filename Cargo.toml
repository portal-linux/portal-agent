[package]
name = "portal-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "In-guest agent for Portal: vsock JSON-RPC bridge for clipboard, display, and Wayland integration"

[[bin]]
name = "portal-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
